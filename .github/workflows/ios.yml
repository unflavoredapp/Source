name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-regression:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run downloader regression (12 scenarios)
        run: |
          cd tools/download-harness
          ./run.sh

      - name: Upload regression logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-logs
          path: tools/download-harness/.harness_tmp/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: download-regression
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('APP.xcodeproj/project.pbxproj', 'APP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Compile
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: APP
          path: APP.ipa
          archive: false
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: /tmp/app_build.log
          archive: false
          if-no-files-found: ignore
          retention-days: 7
