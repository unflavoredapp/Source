name: Build IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('APP.xcodeproj/project.pbxproj', 'APP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Compile unsigned IPA
        run: make
        env:
          CI: true

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: APP
          path: APP.ipa
          if-no-files-found: error

      # Phone-first delivery: drop APP.ipa into Telegram when secrets are set.
      # Repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
      - name: Send IPA to Telegram
        if: >-
          success()
          && github.event_name != 'pull_request'
          && secrets.TELEGRAM_BOT_TOKEN != ''
          && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          SIZE=$(du -h APP.ipa | awk '{print $1}')
          CAPTION=$(printf 'APP.ipa (%s)\n%s @ %s\n%s' \
            "$SIZE" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_SHA:0:7}")
          curl -fsS \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F caption="${CAPTION}" \
            -F document=@APP.ipa \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            >/tmp/telegram-send.json
          echo "Sent APP.ipa to Telegram (${SIZE})"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: /tmp/app_build.log
          if-no-files-found: ignore
          retention-days: 7

  download-regression:
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run downloader regression (12 scenarios)
        run: |
          cd tools/download-harness
          ./run.sh
