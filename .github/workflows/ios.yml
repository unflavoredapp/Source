name: Build IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Native build cache (idevice Rust library)
        uses: actions/cache@v4
        with:
          path: |
            .build/device-native
            IDeviceKit/.build/IDevice.xcframework
          key: idevice-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Native/Device/source.json', 'Native/Device/ksign_pairing.rs', '.github/scripts/build_device_native.py') }}

      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Native/Device/source.json', 'Native/Device/ksign_pairing.rs') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('APP.xcodeproj/project.pbxproj', 'APP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Compile unsigned IPA
        run: make
        env:
          CI: true

      - name: Verify native tunnel is embedded
        run: |
          set -euo pipefail
          rm -rf /tmp/app-ipa-check
          mkdir -p /tmp/app-ipa-check
          unzip -q APP.ipa -d /tmp/app-ipa-check
          APP_BUNDLE=$(find /tmp/app-ipa-check/Payload -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_BUNDLE"
          test -d "$APP_BUNDLE/PlugIns/APPDeviceTunnel.appex"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: APP
          path: APP.ipa
          if-no-files-found: error

      # Phone-first delivery: drop APP.ipa into Telegram when secrets are set.
      # Do not reference secrets in `if:` — that aborts the whole workflow with 0 jobs.
      # Repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
      - name: Send IPA to Telegram
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping delivery"
            exit 0
          fi
          SIZE=$(du -h APP.ipa | awk '{print $1}')
          CAPTION=$(printf 'APP.ipa (%s)\n%s @ %s\n%s' \
            "$SIZE" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_SHA:0:7}")
          curl -fsS \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@APP.ipa \
            -F caption="${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            >/tmp/telegram-send.json
          echo "Sent APP.ipa to Telegram (${SIZE})"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: /tmp/app_build.log
          if-no-files-found: ignore
          retention-days: 7

  download-regression:
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run downloader regression (12 scenarios)
        run: |
          cd tools/download-harness
          ./run.sh
